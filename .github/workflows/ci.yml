name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest
        env:
          PYTHONPATH: backend
          # Exercise the sandbox boundary in CI rather than shipping it untested.
          ENABLE_PYTHON_SANDBOX: 'true'
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Vite Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Production dependencies gate the build; dev-only advisories are
      # reported but do not fail CI, since they never reach a user.
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Report dev npm advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=moderate

  docker-startup-test:
    name: Docker Container Startup Test
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Start Container
        run: |
          echo "🐳 Building local test container..."
          docker build -t rei-signallab-api:test -f backend/Dockerfile backend

          echo "🚀 Starting test container on port 8000..."
          docker run -d --name rei-api-test -p 8000:8000 -e PORT=8000 rei-signallab-api:test
          trap 'docker logs rei-api-test; docker rm -f rei-api-test' EXIT

          echo "🔍 Waiting for container health readiness..."
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready; then
              echo ""
              echo "✓ Docker container startup test passed!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container startup health check timed out!"
          exit 1

name: CD Production Pipeline

on:
  push:
    branches: [ main ]

env:
  GCP_REGION: europe-west1
  CLOUD_RUN_SERVICE: rei-signallab-api
  FIREBASE_PROJECT: signallab-3305b
  LIVE_URL: https://signallab-3305b.web.app

jobs:
  test-and-build:
    name: Build & Test Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/ -v

      - name: Test Backend Container Startup
        run: |
          echo "🐳 Building local test container..."
          docker build -t rei-signallab-api:test -f backend/Dockerfile backend
          echo "🚀 Starting test container on port 8000..."
          docker run -d --name rei-api-test -p 8000:8000 -e PORT=8000 rei-signallab-api:test
          trap 'docker logs rei-api-test; docker rm -f rei-api-test' EXIT

          echo "🔍 Waiting for container health readiness..."
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready; then
              echo ""
              echo "✓ Local Docker container startup test passed!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container startup health check timed out!"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      previous_revision: ${{ steps.capture.outputs.previous_revision }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture previous revision
        id: capture
        run: |
          PREV="$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo '')"
          echo "previous_revision=${PREV}" >> "$GITHUB_OUTPUT"
          echo "📌 Previous revision: ${PREV:-'(first deploy)'}"

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          bash scripts/deploy-cloud-run.sh

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting via ADC
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive

  production-smoke-test:
    name: Production Smoke Test (JSON-Validated)
    needs: [deploy-firebase, deploy-cloud-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (for rollback)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK (for rollback)
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Live Health Endpoints (JSON Content-Type + jq Assertions)
        env:
          PREVIOUS_REVISION: ${{ needs.deploy-cloud-run.outputs.previous_revision }}
        run: |
          set -euo pipefail
          SMOKE_FAILED=0

          check_json_endpoint() {
            local url="$1"
            local expected_status="$2"
            local label="$3"
            local headers body

            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "${headers}" "${body}"' RETURN

            echo "🧪 Verifying ${label} (${url})..."

            if ! curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --dump-header "${headers}" \
              --output "${body}" \
              "${url}"; then
              echo "❌ ${label}: HTTP request failed."
              return 1
            fi

            if ! grep -qi '^content-type:.*application/json' "${headers}"; then
              echo "❌ ${label}: NON_JSON_RESPONSE"
              head -c 500 "${body}"
              return 1
            fi

            if ! jq -e --arg status "${expected_status}" '.status == $status' "${body}" >/dev/null 2>&1; then
              echo "❌ ${label}: Expected status='${expected_status}', got:"
              jq '.' "${body}" 2>/dev/null || cat "${body}"
              return 1
            fi

            echo "✓ ${label} passed."
          }

          check_json_endpoint \
            "${{ env.LIVE_URL }}/api/health/live" \
            "ok" \
            "Liveness Probe" || SMOKE_FAILED=1

          check_json_endpoint \
            "${{ env.LIVE_URL }}/api/health/ready" \
            "ready" \
            "Readiness Probe" || SMOKE_FAILED=1

          echo "🧪 Verifying Version Manifest..."
          VERSION_JSON="$(curl --fail --silent --show-error "${{ env.LIVE_URL }}/api/version" 2>/dev/null || echo "")"
          if [ -z "${VERSION_JSON}" ]; then
            echo "❌ Version Manifest: HTTP request failed."
            SMOKE_FAILED=1
          elif ! jq -e '
            .service == "rei-signallab-api" and
            .version == "2.1.0" and
            .apiVersion == "v1" and
            (.commitSha | length > 0)
          ' <<<"${VERSION_JSON}" >/dev/null 2>&1; then
            echo "❌ Version Manifest assertion failed:"
            echo "${VERSION_JSON}" | jq '.' 2>/dev/null || echo "${VERSION_JSON}"
            SMOKE_FAILED=1
          else
            echo "✓ Version Manifest passed."
          fi

          if [ "${SMOKE_FAILED}" -ne 0 ]; then
            echo ""
            echo "================================================================="
            echo " ❌ SMOKE TEST FAILED — INITIATING AUTO-ROLLBACK"
            echo "================================================================="

            if [ -n "${PREVIOUS_REVISION}" ]; then
              echo "🔄 Rolling back Cloud Run to: ${PREVIOUS_REVISION}..."
              gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
                --region=${{ env.GCP_REGION }} \
                --project=${{ secrets.GCP_PROJECT_ID }} \
                --to-revisions="${PREVIOUS_REVISION}=100" || true
              echo "⚠️  Cloud Run rollback attempted."
            else
              echo "⚠️  No previous revision for rollback (first deploy)."
            fi

            exit 1
          fi

          echo "================================================================="
          echo " 🎉 ALL SMOKE TESTS PASSED — PRODUCTION VERIFIED"
          echo "================================================================="

name: CD Production Pipeline

on:
  push:
    branches: [ main ]

env:
  GCP_REGION: europe-west1
  CLOUD_RUN_SERVICE: rei-signallab-api
  FIREBASE_PROJECT: signallab-3305b
  LIVE_URL: https://signallab.site

jobs:
  test-and-build:
    name: Build & Test Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest
        env:
          PYTHONPATH: backend
          # Exercise the sandbox boundary in CI rather than shipping it untested.
          ENABLE_PYTHON_SANDBOX: 'true'
        run: pytest backend/tests/ -v

      - name: Test Backend Container Startup
        run: |
          echo "🐳 Building local test container..."
          docker build -t rei-signallab-api:test -f backend/Dockerfile backend
          echo "🚀 Starting test container on port 8000..."
          docker run -d --name rei-api-test -p 8000:8000 -e PORT=8000 rei-signallab-api:test
          trap 'docker logs rei-api-test; docker rm -f rei-api-test' EXIT

          echo "🔍 Waiting for container health readiness..."
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready; then
              echo ""
              echo "✓ Local Docker container startup test passed!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container startup health check timed out!"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      previous_revision: ${{ steps.capture.outputs.previous_revision }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture previous active revision (100% traffic)
        id: capture
        run: |
          SERVICE_JSON="$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format=json 2>/dev/null || echo '')"
          
          PREV=""
          if [ -n "${SERVICE_JSON}" ]; then
            PREV="$(jq -r '.status.traffic[]? | select(.percent == 100 or .percent == null) | .revisionName' <<<"${SERVICE_JSON}" | head -n 1)"
            if [ -z "${PREV}" ] || [ "${PREV}" = "null" ]; then
              PREV="$(jq -r '.status.latestReadyRevisionName // .status.traffic[0].revisionName // ""' <<<"${SERVICE_JSON}")"
            fi
          fi

          if [ "${PREV}" = "null" ]; then PREV=""; fi
          echo "previous_revision=${PREV}" >> "$GITHUB_OUTPUT"
          echo "📌 Active production revision for rollback: ${PREV:-'(first deploy)'}"

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          bash scripts/deploy-cloud-run.sh

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting via ADC
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive

  production-smoke-test:
    name: Production Smoke Test (Functional + JSON-Validated)
    needs: [deploy-firebase, deploy-cloud-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (for rollback)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK (for rollback)
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Live Health & Functional API Endpoints
        env:
          PREVIOUS_REVISION: ${{ needs.deploy-cloud-run.outputs.previous_revision }}
        run: |
          set -euo pipefail
          SMOKE_FAILED=0

          check_json_endpoint() {
            local url="$1"
            local expected_status="$2"
            local label="$3"
            local headers body

            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "${headers}" "${body}"' RETURN

            echo "🧪 Verifying ${label} (${url})..."

            if ! curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --dump-header "${headers}" \
              --output "${body}" \
              "${url}"; then
              echo "❌ ${label}: HTTP request failed."
              return 1
            fi

            if ! grep -qi '^content-type:.*application/json' "${headers}"; then
              echo "❌ ${label}: NON_JSON_RESPONSE — expected application/json."
              head -c 500 "${body}"
              return 1
            fi

            if ! jq -e --arg status "${expected_status}" '.status == $status' "${body}" >/dev/null 2>&1; then
              echo "❌ ${label}: Expected status='${expected_status}', got:"
              jq '.' "${body}" 2>/dev/null || cat "${body}"
              return 1
            fi

            echo "✓ ${label} passed."
          }

          # 1. Health Probes
          check_json_endpoint \
            "${{ env.LIVE_URL }}/api/health/live" \
            "ok" \
            "Liveness Probe" || SMOKE_FAILED=1

          check_json_endpoint \
            "${{ env.LIVE_URL }}/api/health/ready" \
            "ready" \
            "Readiness Probe" || SMOKE_FAILED=1

          # 2. Version Manifest (strict SHA regex verification)
          echo "🧪 Verifying Version Manifest..."
          VERSION_JSON="$(curl --fail --silent --show-error "${{ env.LIVE_URL }}/api/version" 2>/dev/null || echo "")"
          if [ -z "${VERSION_JSON}" ]; then
            echo "❌ Version Manifest: HTTP request failed."
            SMOKE_FAILED=1
          elif ! jq -e '
            .service == "rei-signallab-api" and
            .version == "2.1.0" and
            .apiVersion == "v1" and
            (.commitSha | test("^[0-9a-f]{7,40}$"))
          ' <<<"${VERSION_JSON}" >/dev/null 2>&1; then
            echo "❌ Version Manifest assertion failed:"
            echo "${VERSION_JSON}" | jq '.' 2>/dev/null || echo "${VERSION_JSON}"
            SMOKE_FAILED=1
          else
            echo "✓ Version Manifest passed (strict git SHA regex verified)."
          fi

          # 3. Node Catalog Registry Functional Test
          echo "🧪 Verifying Node Catalog Registry..."
          NODES_JSON="$(curl --fail --silent --show-error "${{ env.LIVE_URL }}/api/nodes" 2>/dev/null || echo "")"
          if ! jq -e 'type == "array" and length > 0' <<<"${NODES_JSON}" >/dev/null 2>&1; then
            echo "❌ Node Catalog Registry test failed."
            SMOKE_FAILED=1
          else
            echo "✓ Node Catalog Registry functional test passed."
          fi

          # 4. Vibration Analysis DSP Engine Functional Test
          echo "🧪 Verifying Vibration Analysis DSP Engine..."
          VIB_JSON="$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"sample_rate": 25600, "rpm": {"manual_rpm": 1500.0}}' \
            "${{ env.LIVE_URL }}/api/vibration/analyze" 2>/dev/null || echo "")"

          if ! jq -e '
            (.trust_mode | length > 0) and
            (.time_metrics.rms_acc_g | type == "number") and
            (.fft_frequencies | length > 0)
          ' <<<"${VIB_JSON}" >/dev/null 2>&1; then
            echo "❌ Vibration Analysis DSP Engine test failed."
            echo "${VIB_JSON}" | jq '.' 2>/dev/null || echo "${VIB_JSON}"
            SMOKE_FAILED=1
          else
            echo "✓ Vibration Analysis DSP Engine functional test passed."
          fi

          if [ "${SMOKE_FAILED}" -ne 0 ]; then
            echo ""
            echo "================================================================="
            echo " ❌ SMOKE TEST FAILED — INITIATING AUTO-ROLLBACK"
            echo "================================================================="

            if [ -n "${PREVIOUS_REVISION}" ]; then
              echo "🔄 Rolling back Cloud Run traffic to: ${PREVIOUS_REVISION}..."
              gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
                --region=${{ env.GCP_REGION }} \
                --project=${{ secrets.GCP_PROJECT_ID }} \
                --to-revisions="${PREVIOUS_REVISION}=100" || true
              echo "⚠️  Cloud Run traffic rollback executed (Firebase proxy automatically routes to active traffic revision)."
            else
              echo "⚠️  No previous revision for rollback (first deploy)."
            fi

            exit 1
          fi

          echo "================================================================="
          echo " 🎉 ALL FUNCTIONAL SMOKE TESTS PASSED — PRODUCTION VERIFIED"
          echo "================================================================="

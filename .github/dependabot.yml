version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # Vite and its transitive esbuild move together; splitting them produces
      # PRs that cannot pass CI on their own.
      vite-toolchain:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - esbuild

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
